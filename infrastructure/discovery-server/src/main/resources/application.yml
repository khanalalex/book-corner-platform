server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # This server IS the registry, so it must not register with, or fetch from, another registry.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # DEV ONLY: self-preservation keeps dead instances listed during network trouble.
    # It is confusing while developing, so we switch it off locally. Keep it ON in production.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
